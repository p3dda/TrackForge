name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, offset from the hour so it doesn't line up with everyone else's
    # cron jobs.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7

      # The reusable workflow from google/osv-scanner-action wants
      # security-events: write for SARIF upload, which is more than this
      # needs, so its PR logic is inlined below with the scanner and reporter
      # actions. Using the actions (instead of curl'ing releases/latest) pins
      # the scanner version and lets Dependabot bump it.
      #
      # Accepted findings live in osv-scanner.toml. It is copied out of the
      # tree so the base scan uses the same ignores as the PR -- otherwise a
      # PR that adds an ignore would still see the finding on base, and a PR
      # that removes one would see it as new.

      # push to main / schedule / manual: fail on any known vulnerability.
      - name: Scan lockfiles
        if: github.event_name != 'pull_request'
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=uv.lock
            --lockfile=reflex.lock/bun.lock

      # pull_request: fail only on vulnerabilities the PR introduces, so
      # advisories published against what is already on main don't block
      # unrelated Dependabot/Renovate PRs. Those still fail the daily scan.
      - name: Check out base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cp osv-scanner.toml osv-scanner.pr.toml
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
      - name: Scan base commit
        id: scan-old
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --config=osv-scanner.pr.toml
            --lockfile=uv.lock
            --lockfile=reflex.lock/bun.lock
      - name: Check out PR commit
        if: github.event_name == 'pull_request'
        run: git checkout -f "$GITHUB_SHA"
      - name: Scan PR commit
        id: scan-new
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --config=osv-scanner.pr.toml
            --lockfile=uv.lock
            --lockfile=reflex.lock/bun.lock
      # The scanner exits 1 both on findings and on errors; only a missing
      # results file tells them apart. Don't report "nothing new" then.
      - name: Check that both scans completed
        if: github.event_name == 'pull_request'
        run: |
          status=0
          for f in old-results.json new-results.json; do
            if [ ! -s "$f" ]; then
              echo "::error::OSV-Scanner did not write $f, see the scan step above."
              status=1
            fi
          done
          exit "$status"
      - name: Report vulnerabilities introduced by this PR
        if: github.event_name == 'pull_request'
        uses: google/osv-scanner-action/osv-reporter-action@v2.7.0
        with:
          scan-args: |-
            --old=old-results.json
            --new=new-results.json
            --output-files=table:#stdout
            --output-files=gh-annotations:#stderr
            --fail-on-vuln=true

  ioc-scan:
    name: IOC scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7

      # Looks for artifacts of known npm supply-chain worms (this repo pulls
      # in an npm/bun toolchain transitively via reflex.lock) and generic
      # persistence hooks that autorun when the project is opened in an
      # editor -- the mechanism these worms use to spread from a developer
      # machine into the repo and onward.
      - name: Search for worm artifacts
        run: |
          set -uo pipefail
          fail=0

          note() { echo "::error::$*"; fail=1; }

          # keyv worm (2026-08-04): preinstall pulls in Bun and persists via
          # editor hooks.
          for f in setup.mjs Math_Symbol.js .vscode/setup.mjs .claude/setup.mjs; do
            if [ -e "$f" ]; then note "worm artifact found: $f"; fi
          done
          if find . -name 'setup.mjs' -not -path './node_modules/*' | grep -q .; then
            note "setup.mjs found somewhere in the tree"
          fi

          # Autorun on project open -- the persistence mechanism.
          if [ -f .vscode/tasks.json ] && grep -q 'folderOpen' .vscode/tasks.json; then
            note ".vscode/tasks.json runs a task on open (runOn: folderOpen)"
          fi
          # .claude/settings.json itself is legitimate; only a hook pointing
          # at the worm artifacts is suspicious.
          if [ -f .claude/settings.json ] && grep -qE 'setup\.mjs|Math_Symbol|bun ' .claude/settings.json; then
            note ".claude/settings.json invokes setup.mjs/bun"
          fi

          # Shai-Hulud/TanStack (2026-05-11) and known exfiltration targets.
          if grep -rl --binary-files=without-match \
               -e '79ac49eedf774dd4b0cfa308722bc463cfe5885c' \
               -e 'getsession\.org' -e 'git-tanstack\.com' -e 'webhook\.site' \
               --exclude-dir=node_modules --exclude-dir=.git \
               --exclude=supply-chain.yml . | grep -q .; then
            note "known malware indicator found in working tree"
          fi

          if [ "$fail" -eq 0 ]; then echo "IOC scan clean."; fi
          exit "$fail"
