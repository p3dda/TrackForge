<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="forge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="#1c1917" stroke="#44403c" stroke-width="2"/>
  <!-- anvil -->
  <g fill="url(#forge)">
    <path d="M30 78 h52 q14 0 18 -10 l4 -8 h-26 q-10 0 -10 8 v2 h-38 z"/>
    <rect x="52" y="80" width="22" height="10"/>
    <path d="M42 92 h44 l4 8 h-52 z"/>
  </g>
  <!-- track line being forged -->
  <path d="M20 44 C 36 20, 56 56, 74 34 S 104 24, 112 38"
        fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/>
  <path d="M20 44 C 36 20, 56 56, 74 34 S 104 24, 112 38"
        fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <!-- track points -->
  <circle cx="20" cy="44" r="5" fill="#fafaf9"/>
  <circle cx="74" cy="34" r="4" fill="#fafaf9"/>
  <circle cx="112" cy="38" r="5" fill="#fafaf9"/>
  <!-- sparks -->
  <g fill="#fbbf24">
    <circle cx="40" cy="62" r="2"/>
    <circle cx="88" cy="58" r="2.5"/>
    <circle cx="64" cy="52" r="1.8"/>
  </g>
</svg>
