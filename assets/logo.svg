<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g1b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="#1c1917" stroke="#44403c" stroke-width="2"/>
  <!-- anvil under the impact point -->
  <g fill="#57534e">
    <path d="M34 86 h44 q12 0 16 -9 h-22 q-9 0 -9 7 v2 z"/>
    <rect x="48" y="88" width="18" height="8"/>
    <path d="M42 98 h32 l4 8 h-40 z"/>
  </g>
  <!-- track line passing over the anvil face -->
  <path d="M14 78 C 30 64, 44 88, 60 76 S 96 62, 114 72"
        fill="none" stroke="url(#g1b)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="14" cy="78" r="6" fill="#fafaf9"/>
  <circle cx="60" cy="76" r="5" fill="#fafaf9"/>
  <circle cx="114" cy="72" r="6" fill="#fafaf9"/>
  <!-- hammer striking down -->
  <g transform="rotate(40 76 36)">
    <rect x="72" y="12" width="9" height="42" rx="3.5" fill="#a8a29e"/>
    <rect x="56" y="2" width="40" height="20" rx="5" fill="url(#g1b)"/>
  </g>
  <!-- impact sparks -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="60" x2="42" y2="52"/>
    <line x1="60" y1="58" x2="60" y2="48"/>
    <line x1="72" y1="60" x2="78" y2="52"/>
  </g>
</svg>
