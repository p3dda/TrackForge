<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <circle cx="64" cy="64" r="60" fill="#232325" stroke="#3a3a3d" stroke-width="3"/>
  <!-- anvil under the impact point -->
  <g fill="#57575c">
    <path d="M34 86 h44 q12 0 16 -9 h-22 q-9 0 -9 7 v2 z"/>
    <rect x="48" y="88" width="18" height="8"/>
    <path d="M42 98 h32 l4 8 h-40 z"/>
  </g>
  <!-- track line passing over the anvil face -->
  <path d="M14 78 C 30 64, 44 88, 60 76 S 96 62, 114 72"
        fill="none" stroke="#ffc53d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="14" cy="78" r="7" fill="#ededed"/>
  <circle cx="114" cy="72" r="7" fill="#ededed"/>
  <!-- hammer striking down -->
  <g transform="rotate(40 76 36)">
    <rect x="72" y="12" width="9" height="42" rx="3.5" fill="#a1a1a6"/>
    <rect x="56" y="2" width="40" height="20" rx="5" fill="#ffc53d"/>
  </g>
</svg>
