[project]
name = "trackforge"
version = "0.1.0"
description = "Forge clean GPX tracks - strip waypoints from GPX files and Komoot tours"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "reflex==0.9.11.post1",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
