[project]
name = "trackforge"
version = "0.1.0"
description = "Forge clean GPX tracks - strip waypoints from GPX files and Komoot tours"
requires-python = ">=3.12"
dependencies = [
    "reflex>=0.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
